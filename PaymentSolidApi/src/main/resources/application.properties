spring.application.name=PaymentSolidApi

#  POSTGRESQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paymentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- Configuracoes do JPA e Hibernate ---
spring.jpa.show-sql=false

# Garante que o Hibernate nao tente criar ou alterar tabelas
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# --- Servidor ---
server.port=8082
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- Perfil Ativo ---
spring.profiles.default=local

# --- Logging ---
logging.level.root=INFO
logging.level.br.com.fiap.PaymentSolidApi=INFO

# --- OpenAPI (Swagger) ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packagesToScan=br.com.fiap.PaymentSolidApi.infrastructure.adapter.in.controller
springdoc.api-docs.enabled=false
springdoc.swagger-ui.url=/openapi.yml

# --- Jackson (Serializacao JSON) ---
spring.jackson.serialization.INDENT_OUTPUT=true

# --- Pool de Conexao (Hikari) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# --- Upload de Arquivos ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Configuracoes do RabbitMQ ---
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
app.outbox.poll-interval=1000
app.outbox.confirm-timeout=5000

# --- Nomenclaturas para a Fila de Comprovantes ---
# A exchange e responsavel por rotear as mensagens
app.rabbitmq.exchange.payment=payment.exchange

# A routing key ajuda a exchange a decidir para qual fila enviar a mensagem
app.rabbitmq.routingkey.receipt=payment.receipt.key

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true

# Logging
logging.level.com.fiap=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Liveness não depende de recursos externos; readiness mede o necessário ao serviço.
management.endpoint.health.group.readiness.include=readinessState,db
spring.jpa.open-in-view=false
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.requested-heartbeat=15s
