events { worker_connections 1024; }

http {
    # Define o request id a ser usado: usa o header do cliente quando presente,
    # caso contrário usa um fallback baseado em timestamp e número da conexão.
    # Observação: se o Nginx for compilado com o módulo request_id, você pode
    # preferir usar $request_id como fallback em vez de "$msec-$connection".
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      "$msec-$connection";
    }

    # Formato de log que inclui o request id para facilitar correlação com traces/logs.
    log_format with_reqid '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" req_id=$req_id';

    # Local do access log.
    access_log /var/log/nginx/access.log with_reqid;

    # Define o grupo de servidores para a API de pagamentos.
    upstream payment_api_upstream {
        server payment-api:8082 max_fails=3 fail_timeout=60s;
    }

    # Define o grupo de servidores para a API de recibos.
    upstream receipt_api_upstream {
        server receipt-api:8083 max_fails=3 fail_timeout=60s;
    }

    server {
        listen 80;

        # Rota para a API de pagamentos
        # Todas as requisições que começam com /api/payments são encaminhadas.
        location /api/v1/payments {
            # Ao não especificar um caminho no proxy_pass,
            # o Nginx anexa o URI original do pedido (ex: /api/payments/host).
            proxy_pass http://payment_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Propaga (ou injeta) o correlation id para o upstream
            proxy_set_header X-Request-ID $req_id;
        }

        # Rota para a API de recibos
        location /api/v1/receipts {
            rewrite ^/api/v1/receipts(.*)$ /api/receipts$1 break;
            proxy_pass http://receipt_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Propaga (ou injeta) o correlation id para o upstream
            proxy_set_header X-Request-ID $req_id;
        }

        # Healthcheck Payment API via gateway
        location = /actuator/payment/health {
            proxy_pass http://payment_api_upstream/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
        }

        # Healthcheck Receipt API via gateway
        location = /actuator/receipt/health {
            proxy_pass http://receipt_api_upstream/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
        }

        # Prometheus endpoint Payment API via gateway
        location = /actuator/payment/prometheus {
            proxy_pass http://payment_api_upstream/actuator/prometheus;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
        }

        # Prometheus endpoint Receipt API via gateway
        location = /actuator/receipt/prometheus {
            proxy_pass http://receipt_api_upstream/actuator/prometheus;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
        }
    }
}