# Codificacao UTF-8
spring.mandatory-file-encoding=UTF-8
file.encoding=UTF-8

# Aplicacao
spring.application.name=ReceiptApi

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/receiptdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA e Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# Servidor
server.port=8083
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Configuracoes de Fila
app.rabbitmq.exchange.payment=payment.exchange
app.rabbitmq.queue.receipt=payment.receipt.queue
app.rabbitmq.routingkey.receipt=payment.receipt.key

# Dead-letter (DLX) configuration
app.rabbitmq.exchange.payment.dlx=payment.exchange.dlx
app.rabbitmq.queue.receipt.dlq=payment.receipt.dlq
app.rabbitmq.routingkey.receipt.dlq=payment.receipt.dlq.key

# TTL opcional em milissegundos. Zero desativa expiração para não perder backlog durante uma parada.
app.rabbitmq.queue.receipt.ttl=0


# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true

# Logging
logging.level.com.fiap=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Liveness não depende de recursos externos; readiness mede o necessário ao serviço.
management.endpoint.health.group.readiness.include=readinessState,db,rabbit
spring.jpa.open-in-view=false
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.requested-heartbeat=15s
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Retry é configurado pelo Spring Boot; falhas esgotadas passam pelo recoverer com confirmação.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
