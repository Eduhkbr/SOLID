# promtail-config.yaml
# Configuracao do Promtail: agente que coleta logs de containers Docker e envia ao Loki.

# 'server' define porta HTTP onde Promtail expõe endpoints.
server:
  http_listen_port: 9080

# 'positions' guarda em disco até qual linha dos arquivos o Promtail já leu.
# Isso permite retomar a leitura após reinício sem reprocessar o arquivo inteiro.
positions:
  filename: /tmp/positions.yaml

# 'clients' define para qual endpoint do Loki o Promtail deve enviar os logs.
# Em um ambiente com vários nós, a URL frequentemente aponta para o serviço Loki.
clients:
  - url: http://loki:3100/loki/api/v1/push

# 'scrape_configs' define quais arquivos de log o Promtail deve ler.
# Cada job pode usar 'static_configs' com o label '__path__' definindo o(s)
# caminho(s) de arquivo no sistema de arquivos.
scrape_configs:
  # =====================================================
  # Job principal: Docker Service Discovery
  # Descobre containers automaticamente via Docker socket
  # e extrai labels como container_name, compose_service, etc.
  # =====================================================
  - job_name: docker_sd
    # Descobre containers através do Docker daemon local
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extrai o nome do container como label 'container_name'
      - source_labels: ['__meta_docker_container_name']
        regex: '^/(.+)$'
        target_label: 'container_name'
        replacement: '$1'

      # Extrai o nome do servico compose como label 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Extrai o nome do projeto compose como label 'project'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

      # Extrai o container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

      # Define o caminho do log baseado no container ID
      - source_labels: ['__meta_docker_container_id']
        regex: '(.+)'
        target_label: '__path__'
        replacement: '/var/lib/docker/containers/$1/$1-json.log'

      # Cria label 'application' baseado no nome do servico compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'application'

    pipeline_stages:
      # Parseia o formato JSON padrao do Docker log driver
      - docker: {}
      # Extrai campos JSON dos logs das aplicacoes Spring Boot (logstash-logback-encoder)
      - json:
          expressions:
            level: level
            logger: logger_name
            message: message
            thread: thread_name
            traceId: traceId
            spanId: spanId
      - labels:
          level:
          logger:
          traceId:
          spanId:
