# alert.rules.yml
# Arquivo de regras de alerta do Prometheus.
# Cada grupo contém regras que avaliam expressões PromQL e disparam alertas quando verdadeiras.
# Estrutura de uma regra:
# - alert: <NomeDoAlerta>    -> Identificador curto do alerta
#   expr: <PromQL>            -> Expressão PromQL que retorna série(s) com valor(s) que acionam o alerta
#   for: <duração>           -> Período que a expressão precisa ficar verdadeira para disparar o alerta
#   labels:                   -> Rótulos usados para roteamento/gravidade no Alertmanager
#   annotations:              -> Metadados (summary, description) usados em notificações

groups:
  - name: alertas_essenciais
    rules:
      # Alertas para payment-api
      - alert: ServicoIndisponivel
        # Avalia se a métrica 'up' para o job payment-api está em 0 (indisponível)
        expr: up{job="payment-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instancia do payment-api indisponivel"
          description: "O servico payment-api esta fora do ar ha mais de 1 minuto."

      - alert: PoolConexoesExaurido
        expr: hikaricp_connections_active{job="payment-api"} / hikaricp_connections_max{job="payment-api"} > 0.80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Pool de conexoes quase esgotado (payment-api)"
          description: "Mais de 80% das conexoes do pool estao em uso ha 5 minutos."

      - alert: ErroHttpElevado
        expr: sum(rate(http_server_requests_seconds_count{job="payment-api",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{job="payment-api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de erro HTTP 5xx elevada (payment-api)"
          description: "Mais de 5% das requisicoes estao retornando erro 5xx nos ultimos 5 minutos."

      - alert: UsoCpuElevado
        expr: process_cpu_usage{job="payment-api"} > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de CPU elevado (payment-api)"
          description: "O uso de CPU esta acima de 80% por mais de 5 minutos."

      - alert: UsoMemoriaElevado
        expr: jvm_memory_used_bytes{area="heap",job="payment-api"} / jvm_memory_max_bytes{area="heap",job="payment-api"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de memoria heap elevado (payment-api)"
          description: "Mais de 85% da heap JVM esta em uso ha 5 minutos."

      - alert: LatenciaElevada
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job="payment-api"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia P95 acima de 2s (payment-api)"
          description: "O percentil 95 da latencia esta acima de 2 segundos."

      - alert: RabbitMQFilaGrande
        # Alerta quando filas RabbitMQ (qualquer fila) acumulam mais de 5 mensagens
        expr: rabbitmq_queue_messages{queue=~".*"} > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Fila RabbitMQ com mais de 5 mensagens"
          description: "A fila RabbitMQ '{{ $labels.queue }}' esta acumulando mensagens."

      - alert: BancoConexaoLenta
        expr: rate(jdbc_connections_active{job="payment-api"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taxa elevada de conexoes ativas ao banco (payment-api)"
          description: "O numero de conexoes ativas ao banco esta acima do normal."

      # Alertas para receipt-api
      - alert: ServicoIndisponivelReceipt
        # Avalia se a métrica 'up' para o job receipt-api está em 0 (indisponível)
        expr: up{job="receipt-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instancia do receipt-api indisponivel"
          description: "O servico receipt-api esta fora do ar ha mais de 1 minuto."

      - alert: PoolConexoesExauridoReceipt
        expr: hikaricp_connections_active{job="receipt-api"} / hikaricp_connections_max{job="receipt-api"} > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pool de conexoes quase esgotado (receipt-api)"
          description: "Mais de 80% das conexoes do pool do receipt-api estao em uso."

      - alert: ErroHttpElevadoReceipt
        expr: sum(rate(http_server_requests_seconds_count{job="receipt-api",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{job="receipt-api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de erro HTTP 5xx elevada (receipt-api)"
          description: "Mais de 5% das requisicoes do receipt-api estao retornando erro 5xx."

      - alert: UsoCpuElevadoReceipt
        expr: process_cpu_usage{job="receipt-api"} > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de CPU elevado (receipt-api)"
          description: "O uso de CPU do receipt-api esta acima de 80% por mais de 5 minutos."

      - alert: UsoMemoriaElevadoReceipt
        expr: jvm_memory_used_bytes{area="heap",job="receipt-api"} / jvm_memory_max_bytes{area="heap",job="receipt-api"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de memoria heap elevado (receipt-api)"
          description: "Mais de 85% da heap JVM do receipt-api esta em uso."

      - alert: LatenciaElevadaReceipt
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job="receipt-api"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia P95 acima de 2s (receipt-api)"
          description: "O percentil 95 da latencia do receipt-api esta acima de 2 segundos."

      - alert: BancoConexaoLentaReceipt
        expr: rate(jdbc_connections_active{job="receipt-api"}[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Taxa elevada de conexoes ativas ao banco (receipt-api)"
          description: "O numero de conexoes ativas ao banco do receipt-api esta acima do normal."
