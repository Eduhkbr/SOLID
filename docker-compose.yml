# =========================
# Arquivo docker-compose.yml
#
# Este arquivo orquestra múltiplos serviços para um sistema de pagamentos e comprovantes,
# utilizando PostgreSQL, RabbitMQ, Nginx (load balancer) e dois microsserviços Java Spring Boot.
# =========================

version: '3.8'  # Versão moderna do Docker Compose

services:
  # =========================
  # Serviço de Banco de Dados PostgreSQL
  # =========================
  postgres-payments:
    image: postgres:17  # Usa a imagem oficial do PostgreSQL versão 17
    container_name: postgres_payments  # Nome do container para fácil identificação
    environment:
      POSTGRES_USER: ${POSTGRES_USER}  # Usuário do banco, definido em .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Senha do banco, definido em .env
      POSTGRES_DB: ${POSTGRES_PAYMENTS_DB}  # Nome do banco de dados principal
    networks:
      - payment-db-network  # Rede para microsserviço de pagamentos
    ports:
      - "${POSTGRES_PAYMENTS_PORT}:5432"  # Expõe a porta padrão do PostgreSQL
    volumes:
      - pgdata_payments:/var/lib/postgresql/data  # Persistência dos dados do banco
      - ./database/init-payments:/docker-entrypoint-initdb.d  # Scripts de inicialização do banco
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_PAYMENTS_DB}" ]  # Verifica se o banco está pronto
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres-receipts:
    image: postgres:17  # Usa a imagem oficial do PostgreSQL versão 17
    container_name: postgres_receipts  # Nome do container para fácil identificação
    environment:
      POSTGRES_USER: ${POSTGRES_USER}  # Usuário do banco, definido em .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Senha do banco, definido em .env
      POSTGRES_DB: ${POSTGRES_RECEIPTS_DB}  # Nome do banco de dados principal
    networks:
      - receipt-db-network  # Rede para microsserviço de comprovantes
    ports:
      - "${POSTGRES_RECEIPTS_PORT}:5432"  # Expõe a porta padrão do PostgreSQL
    volumes:
      - pgdata_receipts:/var/lib/postgresql/data  # Persistência dos dados do banco
      - ./database/init-receipts:/docker-entrypoint-initdb.d  # Scripts de inicialização do banco
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_RECEIPTS_DB}" ]  # Verifica se o banco está pronto
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================
  # Serviço de Mensageria RabbitMQ
  # =========================
  rabbitmq:
    image: rabbitmq:4.1-management  # Imagem do RabbitMQ com interface de gerenciamento
    container_name: rabbitmq_broker
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - payment-mq-network  # Rede para microsserviço de pagamentos
      - receipt-mq-network  # Rede para microsserviço de comprovantes
    ports:
      - "5672:5672"    # Porta padrão do RabbitMQ
      - "15672:15672"  # Porta do painel de administração
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}  # Usuário padrão, definido em .env
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}  # Senha padrão, definido em .env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]  # Verifica se o RabbitMQ está pronto
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================
  # Load Balancer (Nginx)
  # =========================
  nginx-lb:
    image: nginx:latest  # Imagem oficial do Nginx
    container_name: nginx_load_balancer
    ports:
      - "80:80"  # Porta de entrada HTTP para o sistema
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # Monta o arquivo de configuração do Nginx
    networks:
      - payment-mq-network
      - receipt-mq-network
    depends_on:
      - payment-api  # Garante que os microsserviços estejam prontos antes do Nginx
      - receipt-api

  # =========================
  # Microsserviço de Pagamentos
  # =========================
  payment-api:
    # build local a partir do Dockerfile do projeto
    build:
      context: .                  # Contexto raiz para incluir parent e contratos compartilhados
      dockerfile: ./PaymentSolidApi/Dockerfile
    deploy:
      replicas: 2 # Cria 2 instâncias para balanceamento de carga
      resources:
        limits:
          cpus: '0.5'   # Aumentado de 0.2 para reduzir tempo de startup (~138s com 0.2 CPU)
          memory: 768M   # Aumentado de 512M (Spring Boot + OTEL têm footprint maior)
    networks:
      - payment-db-network  # Acesso ao PostgreSQL
      - payment-mq-network  # Acesso ao RabbitMQ
    environment:
      - INSTANCE_ID=${COMPOSE_PROJECT_NAME}_payment-api_1
      - SERVER_PORT=8082  # Porta interna do serviço
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-payments:5432/${POSTGRES_PAYMENTS_DB}  # URL do banco
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    depends_on:
      postgres-payments:
        condition: service_healthy  # Só inicia após o banco estar pronto
      rabbitmq:
        condition: service_healthy  # Só inicia após o RabbitMQ estar pronto
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1" ]
      interval: 15s   # Mais frequente para detectar prontidão mais rápido
      timeout: 10s
      retries: 5      # Aumentado: falhas durante startup não marcam o container como unhealthy
      start_period: 210s  # Margem segura acima do tempo real observado (~138s com CPU limitada)

  # =========================
  # Microsserviço de Comprovantes
  # =========================
  receipt-api:
    build:
      context: .
      dockerfile: ./ReceiptApi/Dockerfile
    deploy:
      replicas: 2 # Cria 2 instâncias para balanceamento de carga
      resources:
        limits:
          cpus: '0.5'   # Aumentado de 0.2 para reduzir tempo de startup
          memory: 768M   # Aumentado de 512M
    networks:
      - receipt-db-network  # Acesso ao PostgreSQL
      - receipt-mq-network  # Acesso ao RabbitMQ
    environment:
      - INSTANCE_ID=${COMPOSE_PROJECT_NAME}_receipt-api_1
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-receipts:5432/${POSTGRES_RECEIPTS_DB}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres-receipts:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 210s  # Margem segura acima do tempo real de startup

  # =========================
  # Exporter do PostgreSQL (para Prometheus)
  # =========================
  postgres-exporter-payments:
    image: quay.io/prometheuscommunity/postgres-exporter
    container_name: postgres_exporter_payments
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-payments:5432/${POSTGRES_PAYMENTS_DB}?sslmode=disable
    depends_on:
      - postgres-payments
    networks:
      - payment-db-network
    ports:
      - "${POSTGRES_EXPORTER_PAYMENTS_PORT}:9187"

  postgres-exporter-receipts:
    image: quay.io/prometheuscommunity/postgres-exporter
    container_name: postgres_exporter_receipts
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-receipts:5432/${POSTGRES_RECEIPTS_DB}?sslmode=disable
    depends_on:
      - postgres-receipts
    networks:
      - receipt-db-network
    ports:
      - "${POSTGRES_EXPORTER_RECEIPTS_PORT}:9187"

  # =========================
  # Exporter do RabbitMQ (para Prometheus)
  # =========================
  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter
    container_name: rabbitmq_exporter
    environment:
      - RABBIT_URL=http://rabbitmq:15672
      - RABBIT_USER=${RABBITMQ_USER}
      - RABBIT_PASSWORD=${RABBITMQ_PASS}
    depends_on:
      - rabbitmq
    networks:
      - payment-mq-network
      - receipt-mq-network
    ports:
      - "9419:9419"

  # =========================
  # Prometheus (Coleta de Métricas)
  # =========================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus  # Volume dedicado para persistência dos dados do Prometheus
    networks:
      - payment-db-network
      - receipt-db-network
      - payment-mq-network
      - receipt-mq-network

  # =========================
  # Grafana
  # =========================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - payment-db-network
      - receipt-db-network
      - payment-mq-network
      - receipt-mq-network
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

  # =========================
  # Alertmanager (Gerenciamento de Alertas)
  # =========================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"  # Interface web do Alertmanager
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - payment-db-network
      - receipt-db-network
      - payment-mq-network
      - receipt-mq-network

  # =========================
  # Loki (Centralização de Logs)
  # =========================
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "3100:3100"  # Porta padrão da API do Loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./prometheus/loki-data/chunks:/loki/chunks
      - ./prometheus/loki-data/index:/loki/index
      - ./prometheus/loki-data/boltdb-cache:/loki/boltdb-cache
      - ./prometheus/loki-data/compactor:/loki/compactor
      - ./prometheus/loki-data/wal:/wal
      - ./prometheus/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - payment-db-network
      - receipt-db-network
      - payment-mq-network
      - receipt-mq-network

  # =========================
  # Promtail (Coletor de Logs para o Loki)
  # =========================
  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./prometheus/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - payment-db-network
      - receipt-db-network
      - payment-mq-network
      - receipt-mq-network
    depends_on:
      - loki

  # =========================
  # Serviço de Tracing Tempo
  # =========================
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./prometheus/loki-data:/tmp/tempo
      - ./prometheus/tempo-config.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"   # HTTP API (usada pelo Grafana)
      - "4317:4317"   # OTLP gRPC (recebe traces das aplicações)
    networks:
      - payment-mq-network
      - receipt-mq-network

# =========================
# Volumes para persistência de dados
# =========================
volumes:
  pgdata_payments:
  pgdata_receipts:
  rabbitmq_data:
  grafana_data:
  prometheus_data:  # Volume para dados do Prometheus
  loki_data:  # Volume para dados do Loki

# =========================
# Redes customizadas para isolar e conectar serviços
# =========================
networks:
  payment-db-network:
    driver: bridge
    name: payment_database_network  # Rede para comunicação entre payment-api e banco
  payment-mq-network:
    driver: bridge
    name: payment_messaging_network  # Rede para comunicação entre payment-api e RabbitMQ
  receipt-db-network:
    driver: bridge
    name: receipt_database_network  # Rede para comunicação entre receipt-api e banco
  receipt-mq-network:
    driver: bridge
    name: receipt_messaging_network  # Rede para comunicação entre receipt-api e RabbitMQ
