# Laboratório local: nomes, redes e volumes pertencem ao projeto definido por -p.
name: aula-conteinerizacao

# Rotação evita crescimento ilimitado de logs no disco do Docker Desktop.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-api: &api
  init: true
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 768m
  cpus: 1.0
  pids_limit: 256
  # Spring tem 30s por fase; concedemos margem antes do SIGKILL.
  stop_grace_period: 45s
  logging: *logging

services:
  postgres:
    image: postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-payment_app}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Defina PAYMENT_DB_PASSWORD no .env}
      RECEIPT_DB_USER: ${RECEIPT_DB_USER:-receipt_app}
      RECEIPT_DB_PASSWORD: ${RECEIPT_DB_PASSWORD:?Defina RECEIPT_DB_PASSWORD no .env}
    # Não publica o banco no host; APIs acessam postgres:5432 pelas redes.
    networks: [payment-db, receipt-db]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      # $$ adia expansão até o shell do contêiner; não comprova migrações.
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging: *logging

  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
    # Identidade do nó estável permite reencontrar os dados após recriação.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Defina RABBITMQ_USER no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Defina RABBITMQ_PASS no .env}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio none"
    networks: [payment-mq, receipt-mq]
    ports:
      # Só a interface de aula é publicada, restrita ao computador local.
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    logging: *logging

  payment-api:
    <<: *api
    image: ${PAYMENT_IMAGE:-aula-payment:local}
    build:
      context: ./PaymentSolidApi
      dockerfile: ${PAYMENT_DOCKERFILE:-Dockerfile}
    ports: ["127.0.0.1:${PAYMENT_PORT:-8082}:8082"]
    networks: [payment-db, payment-mq]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_DB_USER:-payment_app}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:?Defina PAYMENT_DB_PASSWORD no .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Defina RABBITMQ_USER no .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:?Defina RABBITMQ_PASS no .env}
      # JVM lê JAVA_TOOL_OPTIONS; heap deixa margem para memória nativa.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", http://localhost:8082/actuator/health/readiness]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 40s
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  receipt-api:
    <<: *api
    image: ${RECEIPT_IMAGE:-aula-receipt:local}
    build:
      context: ./ReceiptApi
      dockerfile: Dockerfile
    ports: ["127.0.0.1:${RECEIPT_PORT:-8083}:8083"]
    networks: [receipt-db, receipt-mq]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/receiptdb
      SPRING_DATASOURCE_USERNAME: ${RECEIPT_DB_USER:-receipt_app}
      SPRING_DATASOURCE_PASSWORD: ${RECEIPT_DB_PASSWORD:?Defina RECEIPT_DB_PASSWORD no .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Defina RABBITMQ_USER no .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:?Defina RABBITMQ_PASS no .env}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", http://localhost:8083/actuator/health/readiness]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 40s
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

# down preserva volumes; down -v é reset destrutivo, nunca encerramento rotineiro.
volumes:
  postgres_data:
  rabbitmq_data:

# O banco é uma instância única com bancos/papéis separados. Redes não substituem autorização SQL.
networks:
  payment-db:
  receipt-db:
  payment-mq:
  receipt-mq:
