name: Publicação opcional no Docker Hub
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar imagens nas credenciais configuradas
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./PaymentSolidApi
          push: ${{ inputs.publish }}
          tags: ${{ inputs.publish && format('{0}/payment-api:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || 'aula-payment:local' }}
      - uses: docker/build-push-action@v6
        with:
          context: ./ReceiptApi
          push: ${{ inputs.publish }}
          tags: ${{ inputs.publish && format('{0}/receipt-api:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || 'aula-receipt:local' }}
