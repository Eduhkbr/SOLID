name: CI - Maven & SonarCloud

on:
  push:
    branches: [ feat/lb ]
  pull_request:
    branches: [ feat/lb ]

jobs:
  build-and-sonar-payments:
    name: Build, Test and SonarCloud (PaymentSolidApi)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY_PAYMENTS: ${{ secrets.SONAR_PROJECT_KEY_PAYMENTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # ------------------- PaymentSolidApi -------------------
      - name: Build & test PaymentSolidApi (JaCoCo)
        working-directory: ./PaymentSolidApi
        env:
          MAVEN_OPTS: -Xmx2g
        run: mvn -B -V -DskipTests=false test jacoco:report

      - name: Sonar analysis PaymentSolidApi
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY_PAYMENTS != '' }}
        working-directory: ./PaymentSolidApi
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ env.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY_PAYMENTS: ${{ env.SONAR_PROJECT_KEY_PAYMENTS }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.login=${{ env.SONAR_TOKEN }} \
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY_PAYMENTS }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
